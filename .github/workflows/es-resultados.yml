# Noche electoral de España (29/11/2026): lee el escrutinio provisional del
# Ministerio del Interior y publica data/especiales/espana-2026-resultados.json;
# el sitio lo lee cada minuto. También se puede lanzar a mano desde
# Actions → Run workflow.
name: Resultados España
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutos que queda leyendo los resultados
        default: '55'
  schedule:
    - cron: '*/15 19-23 29 11 *'
    - cron: '*/15 0-2 30 11 *'
    - cron: '0 9-21/3 30 11 *'
permissions:
  contents: write
concurrency:
  group: es-resultados
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Leer resultados y publicar
        env:
          MINUTES: ${{ github.event.inputs.minutes || '14' }}
          ES_INTERIOR_BASE: ${{ vars.ES_INTERIOR_BASE }}
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            git fetch -q origin main && git reset -q --hard origin/main || true
            timeout 170 python3 tools/es_resultados.py interior || echo "pasada fallida o lenta"
            git add -N data/especiales/espana-2026-resultados.json 2>/dev/null || true
            if ! git diff --quiet -- data/especiales/espana-2026-resultados.json; then
              git add data/especiales/espana-2026-resultados.json
              git commit -q -m "Resultados España $(date -u +%H:%M) UTC" || true
              git push -q origin HEAD:main || echo "push rechazado, reintento en la próxima pasada"
            fi
            [ $(( $(date +%s) + 120 )) -ge $end ] && break
            sleep 100
          done
